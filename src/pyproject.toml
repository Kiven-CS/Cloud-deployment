[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hello-azd-python"
version = "0.1.0"
description = "A beginner-friendly Azure Developer CLI sample app."
requires-python = ">=3.11"
dependencies = [
  "azure-data-tables==12.7.0",
  "azure-identity==1.25.3",
  "azure-storage-blob==12.30.1",
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pip-tools==7.6.1",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]