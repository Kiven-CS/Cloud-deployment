name: Deploy with azd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/pyproject.toml
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install --requirement src/requirements.lock
      - run: pip install -e "./src[dev]"
      - run: ruff check src
      - run: ruff format --check src
      - run: pip-audit --requirement src/requirements.lock
      - name: Run unit & API tests
        env:
          STORAGE_URL: https://windows.net
          TABLES_URL: https://windows.net
        run: pytest src/tests


  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2

      - name: Log in to azd with federated credentials
        run: >-
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --federated-credential-provider github
          --tenant-id "$AZURE_TENANT_ID"

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap Base Infrastructure if Missing
        run: |
          RG="rg-$AZURE_ENV_NAME"
          if [ "$(az group exists --name "$RG")" = "false" ]; then
            echo "Resource group $RG not found. Provisioning base ACR and infrastructure..."
            azd provision --no-prompt
          else
            echo "Resource group $RG already exists. Skipping cold bootstrap."
          fi



      - name: Build Container Image
        run: |
          RG="rg-$AZURE_ENV_NAME"
          ACR_NAME=$(az acr list -g "$RG" --query '.name' -o tsv)
          ACA_NAME=$(az containerapp list -g "$RG" --query '.name' -o tsv)
          PREV_IMAGE=$(az containerapp show -n "$ACA_NAME" -g "$RG" --query 'properties.template.containers.image' -o tsv || true)

          IMAGE="$ACR_NAME.azurecr.io/hello-azd-python:${{ github.sha }}"
          docker build -t "$IMAGE" ./src
          echo "RG=$RG" >> $GITHUB_ENV
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACA_NAME=$ACA_NAME" >> $GITHUB_ENV
          echo "PREV_IMAGE=$PREV_IMAGE" >> $GITHUB_ENV
          echo "CONTAINER_IMAGE_NAME=$IMAGE" >> $GITHUB_ENV



      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CONTAINER_IMAGE_NAME }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Push Container Image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$CONTAINER_IMAGE_NAME"
          azd env new "$AZURE_ENV_NAME" --no-prompt || true
          azd env set CONTAINER_IMAGE_NAME "$CONTAINER_IMAGE_NAME"



      - name: Provision Infrastructure & Deploy Revision
        run: azd provision --no-prompt
      
      - name: Post-Deploy End-to-End Smoke Test
        run: |
         APP_FQDN=$(az containerapp show -n "$ACA_NAME" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)
         HEALTH_URL="https://$APP_FQDN/healthz"
         echo "Checking health endpoint: $HEALTH_URL"
         for i in $(seq 1 24); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
          if [ "$STATUS" -eq 200 ]; then
           echo "Smoke test passed (HTTP 200)!"
           exit 0
         fi
         echo "Attempt $i/12 returned HTTP $STATUS; retrying in 5s..."
         sleep 5
         done
         echo "Smoke test failed after 60s!"
         exit 1

      - name: Rollback to Previous Revision on Failure
        if: failure() && env.PREV_IMAGE != '' && env.PREV_IMAGE != '://microsoft.com'
        run: |
         echo "Deployment or smoke test failed. Rolling back $ACA_NAME to $PREV_REVISION..."
         az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$RG" \
            --image "$PREV_IMAGE"



