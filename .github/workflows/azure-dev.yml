name: Deploy with azd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/pyproject.toml
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install --requirement src/requirements.lock
      - run: pip install -e "./src[dev]"
      - run: ruff check src
      - run: ruff format --check src
      - run: pip-audit --requirement src/requirements.lock

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2

      - name: Log in to azd with federated credentials
        run: >-
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --federated-credential-provider github
          --tenant-id "$AZURE_TENANT_ID"

      - name: Provision Infrastructure (Bicep IaC)
        run: azd provision --no-prompt

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, Push, and Deploy Container Revision
        run: |
          RG="rg-$AZURE_ENV_NAME"
          ACR_NAME=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          ACA_NAME=$(az containerapp list -g "$RG" --query "[0].name" -o tsv)
          IMAGE="$ACR_NAME.azurecr.io/hello-azd-python:${{ github.sha }}"

          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" ./src
          docker push "$IMAGE"

          az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"
